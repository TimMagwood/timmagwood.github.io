<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Builder</title>
</head>
<body>
    <h2>Select a Chart Type</h2>
    <div class="chart-selection">
        <img src="assets/chart-thumbnails/line.png" alt="Line Chart" data-type="line" />
        <img src="assets/chart-thumbnails/bar.png" alt="Bar Chart" data-type="bar" />
        <img src="assets/chart-thumbnails/heatmap.png" alt="Heatmap Chart" data-type="heatmap" />
    </div>

    <script src="js/state.js"></script>
    <script>
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', () => {
        const chartType = img.getAttribute('data-type');
        localStorage.setItem('chartType', chartType);
        window.location.href = 'stock-select.html';
        });
    });
    </script>
</body>
</html>
